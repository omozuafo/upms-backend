services:
  - type: web
    name: upms-backend
    env: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: sqlite
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://upms-frontend.vercel.app
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: BROADCAST_CONNECTION
        value: log

databases:
  - name: upms-db
    databaseName: upms_db
    user: upms
    plan: free
